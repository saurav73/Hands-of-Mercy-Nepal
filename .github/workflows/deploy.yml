name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# NOTE (2026-10-24): the deploy-preview and deploy-production jobs were removed.
# They were left over from the repo's initial commit and could never succeed:
# no VERCEL_TOKEN secret is configured and no Vercel project is linked to this
# repo, so every push to main ended in a failed "Deploy Production" run and a
# failure email. The live site (handofmercy.vercel.app) is deployed separately
# from the local source in ~/workspace/projects/hands-of-mercy-src via the
# Vercel CLI, and it is NOT touched by this workflow. If the repo is ever
# synced to the live site's code and wired to a Vercel project, the deploy
# jobs can be restored from git history (see commit "Remove broken deploy
# jobs from CI").

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
